<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="قطعات سیستم ترمز خودرو">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="0.5" stop-color="#f0eee7"/>
      <stop offset="1" stop-color="#e3e0d5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#FFCD00" stop-opacity="0.32"/>
      <stop offset="0.65" stop-color="#FFCD00" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFCD00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c858f"/>
      <stop offset="0.35" stop-color="#3a424a"/>
      <stop offset="0.7" stop-color="#707983"/>
      <stop offset="1" stop-color="#20262c"/>
    </linearGradient>
    <linearGradient id="caliper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="1" stop-color="#c79b00"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1a1a1a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <ellipse cx="400" cy="292" rx="330" ry="245" fill="url(#glow)"/>
  <circle cx="400" cy="292" r="250" fill="none" stroke="#1a1a1a" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="400" cy="292" r="286" fill="none" stroke="#FFCD00" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="6 14"/>

  <g opacity="0.6" stroke="#FFCD00" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M86 148H214"/>
    <path d="M86 174H170"/>
    <path d="M598 464H716"/>
    <path d="M644 490H718"/>
  </g>

  <g transform="translate(400 292)">
    <ellipse cx="0" cy="190" rx="230" ry="26" fill="#1a1a1a" opacity="0.1"/>

    <circle r="186" fill="url(#disc)" stroke="#aab2ba" stroke-opacity="0.35" stroke-width="4"/>
    <circle r="150" fill="none" stroke="#0e1114" stroke-opacity="0.6" stroke-width="12"/>
    <circle r="124" fill="#1b2025" stroke="#FFCD00" stroke-opacity="0.25" stroke-width="2"/>

    <g fill="#0a0c0e" stroke="#FFCD00" stroke-opacity="0.28" stroke-width="3">
      <circle cx="0" cy="-96" r="10"/>
      <circle cx="68" cy="-68" r="10"/>
      <circle cx="96" cy="0" r="10"/>
      <circle cx="68" cy="68" r="10"/>
      <circle cx="0" cy="96" r="10"/>
      <circle cx="-68" cy="68" r="10"/>
      <circle cx="-96" cy="0" r="10"/>
      <circle cx="-68" cy="-68" r="10"/>
    </g>

    <circle r="58" fill="#1b2025" stroke="#98a1ab" stroke-opacity="0.5" stroke-width="3"/>
    <circle r="22" fill="#FFCD00" fill-opacity="0.5"/>
    <g fill="#aab2ba" opacity="0.8">
      <circle cx="0" cy="-36" r="5"/>
      <circle cx="31" cy="18" r="5"/>
      <circle cx="-31" cy="18" r="5"/>
    </g>

    <path d="M98 -132C150 -104 176 -54 178 4" fill="none" stroke="url(#caliper)" stroke-width="34" stroke-linecap="round"/>
    <path d="M110 -142C166 -112 194 -58 196 6" fill="none" stroke="#1a1a1a" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
    <g fill="#FFCD00" opacity="0.55">
