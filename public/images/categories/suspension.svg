<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="قطعات سیستم تعلیق و فرمان">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="0.5" stop-color="#f0eee7"/>
      <stop offset="1" stop-color="#e3e0d5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#FFCD00" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#FFCD00" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFCD00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b747e"/>
      <stop offset="0.5" stop-color="#363d45"/>
      <stop offset="1" stop-color="#171b1f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1a1a1a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <ellipse cx="400" cy="292" rx="330" ry="245" fill="url(#glow)"/>
  <circle cx="400" cy="292" r="250" fill="none" stroke="#1a1a1a" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="400" cy="292" r="286" fill="none" stroke="#FFCD00" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 14"/>

  <g opacity="0.6" stroke="#FFCD00" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M84 146H208"/>
    <path d="M84 172H164"/>
    <path d="M602 466H718"/>
    <path d="M648 492H720"/>
  </g>

  <g transform="translate(400 290) rotate(-3)">
    <ellipse cx="0" cy="196" rx="230" ry="26" fill="#1a1a1a" opacity="0.1"/>

    <!-- shock absorber -->
    <rect x="-34" y="-194" width="68" height="94" rx="18" fill="url(#metal)" stroke="#98a1ab" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="-12" y="-238" width="24" height="54" rx="10" fill="#b0b8c0" stroke="#7c858f" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="-26" y="-108" width="52" height="216" rx="14" fill="#20262c" stroke="#98a1ab" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="-16" y="-100" width="32" height="200" rx="10" fill="#FFCD00" fill-opacity="0.12"/>

    <!-- coil spring -->
    <path d="M-76 -92C-116 -70 -116 -38 -76 -16C-36 6 -36 38 -76 60C-116 82 -116 114 -76 136C-36 158 -36 190 -76 212"
          fill="none" stroke="#d7dde3" stroke-width="15" stroke-linecap="round" opacity="0.95"/>
    <path d="M-76 -92C-116 -70 -116 -38 -76 -16C-36 6 -36 38 -76 60C-116 82 -116 114 -76 136C-36 158 -36 190 -76 212"
          fill="none" stroke="#8c959f" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- control arm -->
    <path d="M-26 108L-172 184M-26 108L122 184M-172 184H122" fill="none" stroke="url(#metal)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-172 184H122" fill="none" stroke="#FFCD00" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-172" cy="184" r="26" fill="#20262c" stroke="#98a1ab" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="122" cy="184" r="26" fill="#20262c" stroke="#98a1ab" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="-172" cy="184" r="9" fill="#FFCD00" fill-opacity="0.55"/>
    <circle cx="122" cy="184" r="9" fill="#FFCD00" fill-opacity="0.55"/>

    <!-- top mount -->
    <rect x="-76" y="-252" width="152" height="34" rx="17" fill="url(#metal)" stroke="#98a1ab" stroke-opacity="0.45" stroke-width="2"/>
    <g fill="#FFCD00" opacity="0.6">
      <circle cx="-50" cy="-235" r="4"/>
      <circle cx="0" cy="-235" r="4"/>
      <circle cx="50" cy="-235" r="4"/>
    </g>

    <path d="M34 86H132" stroke="#9aa3ad" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
    <circle cx="150" cy="86" r="22" fill="none" stroke="#FFCD00" stroke-width="6" stroke-opacity="0.7"/>
  </g>
</svg>
