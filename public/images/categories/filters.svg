<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="فیلترها و قطعات سرویس دوره‌ای">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="0.5" stop-color="#f0eee7"/>
      <stop offset="1" stop-color="#e3e0d5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#FFCD00" stop-opacity="0.28"/>
      <stop offset="0.65" stop-color="#FFCD00" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFCD00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b747e"/>
      <stop offset="0.5" stop-color="#363d45"/>
      <stop offset="1" stop-color="#171b1f"/>
    </linearGradient>
    <linearGradient id="filter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.5" stop-color="#FFCD00"/>
      <stop offset="1" stop-color="#b88d00"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1a1a1a" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <ellipse cx="400" cy="292" rx="330" ry="245" fill="url(#glow)"/>
  <circle cx="400" cy="292" r="250" fill="none" stroke="#1a1a1a" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="400" cy="292" r="286" fill="none" stroke="#FFCD00" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="6 14"/>

  <g opacity="0.6" stroke="#FFCD00" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M84 146H208"/>
    <path d="M84 172H164"/>
    <path d="M602 466H718"/>
    <path d="M648 492H720"/>
  </g>

  <g transform="translate(400 290) rotate(-2)">
    <ellipse cx="0" cy="190" rx="240" ry="28" fill="#1a1a1a" opacity="0.1"/>

    <!-- oil filter -->
    <g transform="translate(-96 18)">
      <rect x="-76" y="-118" width="152" height="236" rx="32" fill="url(#filter)" stroke="#a57e00" stroke-opacity="0.5" stroke-width="3"/>
      <rect x="-76" y="-118" width="152" height="52" rx="26" fill="#d9aa00" opacity="0.55"/>
      <ellipse cx="0" cy="-118" rx="74" ry="18" fill="#f2c200" stroke="#a57e00" stroke-opacity="0.4" stroke-width="2"/>
      <g stroke="#1a1a1a" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round">
        <path d="M-36 -78V-30"/>
        <path d="M0 -78V-30"/>
        <path d="M36 -78V-30"/>
      </g>
      <circle cx="0" cy="34" r="42" fill="none" stroke="#1a1a1a" stroke-opacity="0.18" stroke-width="8"/>
      <circle cx="0" cy="34" r="20" fill="#1a1a1a" opacity="0.35"/>
      <path d="M-44 136H44" stroke="#1a1a1a" stroke-opacity="0.15" stroke-width="4"/>
    </g>

    <!-- air filter -->
    <g transform="translate(146 72) rotate(8)">
      <rect x="-96" y="-92" width="192" height="184" rx="24" fill="#20262c" stroke="#98a1ab" stroke-opacity="0.45" stroke-width="3"/>
      <rect x="-76" y="-72" width="152" height="144" rx="16" fill="url(#metal)"/>
      <g stroke="#FFCD00" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round">
        <path d="M-58 -44H58"/>
        <path d="M-58 -20H58"/>
        <path d="M-58 4H58"/>
        <path d="M-58 28H58"/>
        <path d="M-58 52H58"/>
      </g>
      <path d="M-96 -58H-116M-96 58H-116M96 -58H116M96 58H116" stroke="#9aa3ad" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- wrench accent -->
    <g transform="translate(58 190) rotate(-24)" opacity="0.85">
      <path d="M-112 0H96" stroke="#1a1a1a" stroke-opacity="0.5" stroke-width="18" stroke-linecap="round"/>
      <circle cx="108" cy="0" r="30" fill="none" stroke="#1a1a1a" stroke-opacity="0.5" stroke-width="16"/>
    </g>
  </g>
</svg>
